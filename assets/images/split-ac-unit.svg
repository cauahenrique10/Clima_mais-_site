<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <!-- AC Unit Shadows & Gradients -->
    <linearGradient id="acBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="90%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="acLouverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ledGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Air Flow Gradient -->
    <linearGradient id="coolBreeze" x1="50%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#bae6fd" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cool Air Breeze Emission -->
  <g opacity="0.9">
    <path d="M 120 170 C 100 240, 40 330, 20 420 C 180 430, 360 410, 520 420 C 490 320, 560 230, 580 170 Z" fill="url(#coolBreeze)" />
    <!-- Air flow stream lines -->
    <path d="M 160 175 Q 120 280 80 410" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75" />
    <path d="M 260 175 Q 220 290 190 415" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
    <path d="M 370 175 Q 350 300 330 420" stroke="#0ea5e9" stroke-width="3.5" opacity="0.65" />
    <path d="M 480 175 Q 470 290 460 410" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.7" />
    
    <!-- Snowflake particles in the breeze -->
    <g fill="#38bdf8" opacity="0.8" filter="url(#iceGlow)">
      <!-- Snowflake 1 -->
      <g transform="translate(180, 260) scale(0.6)">
        <circle cx="0" cy="0" r="4" fill="#ffffff" />
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#bae6fd" stroke-width="2.5" />
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#bae6fd" stroke-width="2.5" />
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="#bae6fd" stroke-width="2.5" />
        <line x1="-10" y1="10" x2="10" y2="-10" stroke="#bae6fd" stroke-width="2.5" />
      </g>
      <!-- Snowflake 2 -->
      <g transform="translate(320, 310) scale(0.75)">
        <circle cx="0" cy="0" r="4" fill="#ffffff" />
        <line x1="-18" y1="0" x2="18" y2="0" stroke="#bae6fd" stroke-width="3" />
        <line x1="0" y1="-18" x2="0" y2="18" stroke="#bae6fd" stroke-width="3" />
        <line x1="-12" y1="-12" x2="12" y2="12" stroke="#bae6fd" stroke-width="3" />
        <line x1="-12" y1="12" x2="12" y2="-12" stroke="#bae6fd" stroke-width="3" />
      </g>
      <!-- Snowflake 3 -->
      <g transform="translate(450, 240) scale(0.55)">
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#bae6fd" stroke-width="2" />
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#bae6fd" stroke-width="2" />
      </g>
      <!-- Snowflake 4 -->
      <g transform="translate(240, 370) scale(0.5)">
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#bae6fd" stroke-width="2" />
        <line x1="0" y1="-12" x2="0" y2="12" stroke="#bae6fd" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Modern Split Air Conditioner Indoor Unit Body -->
  <g filter="url(#dropShadow)" transform="translate(50, 40)">
    <!-- Main Shell Base -->
    <rect x="20" y="20" width="560" height="135" rx="14" fill="url(#acBodyGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Top Air Intake Grille subtle lines -->
    <g opacity="0.35" stroke="#94a3b8" stroke-width="1.5">
      <line x1="50" y1="28" x2="550" y2="28" />
      <line x1="50" y1="34" x2="550" y2="34" />
      <line x1="50" y1="40" x2="550" y2="40" />
    </g>

    <!-- Front Beveled Edge Cover -->
    <path d="M 22 46 L 578 46 L 575 125 C 575 132, 565 138, 555 138 L 45 138 C 35 138, 25 132, 25 125 Z" fill="#ffffff" />
    <!-- Subtle Reflection Gloss -->
    <path d="M 25 48 L 575 48 L 573 70 Q 300 85 27 70 Z" fill="#ffffff" opacity="0.8" />
    <line x1="30" y1="90" x2="570" y2="90" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Brand Label subtle -->
    <text x="300" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
      CLIMAMAIS INVERTER
    </text>

    <!-- Digital LED Display (22°C as in flyer!) -->
    <g transform="translate(485, 62)">
      <!-- Subtle display recess -->
      <rect x="0" y="0" width="68" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <!-- LED Glowing Number -->
      <text x="32" y="30" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="26" fill="#0284c7" text-anchor="middle" filter="url(#iceGlow)">
        22°
      </text>
      <!-- Small ECO / Snowflake icon above display -->
      <circle cx="58" cy="12" r="2.5" fill="#10b981" />
    </g>

    <!-- Air Discharge Outlet / Louver Flap -->
    <rect x="35" y="132" width="530" height="24" rx="4" fill="url(#acLouverGrad)" />
    <!-- Flap blade (angled downward) -->
    <path d="M 38 136 L 562 136 L 558 152 L 42 152 Z" fill="#475569" stroke="#334155" stroke-width="1" />
    <line x1="45" y1="144" x2="555" y2="144" stroke="#64748b" stroke-width="1" />
  </g>
</svg>