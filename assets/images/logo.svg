<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006ef5" />
      <stop offset="50%" stop-color="#0056d6" />
      <stop offset="100%" stop-color="#072146" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0056d6" />
      <stop offset="100%" stop-color="#041b3a" />
    </linearGradient>
    <linearGradient id="waveSubGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8e8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem -->
  <g transform="translate(10, 5)">
    <!-- Main Circle -->
    <circle cx="55" cy="55" r="48" fill="url(#circleGrad)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Snowflake -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main axes -->
      <line x1="55" y1="22" x2="55" y2="68" />
      <line x1="32" y1="36" x2="78" y2="60" />
      <line x1="32" y1="58" x2="78" y2="34" />
      
      <!-- Snowflake branches -->
      <!-- Top -->
      <line x1="55" y1="28" x2="49" y2="34" />
      <line x1="55" y1="28" x2="61" y2="34" />
      <!-- Top Right -->
      <line x1="72" y1="37" x2="68" y2="31" />
      <line x1="72" y1="37" x2="76" y2="44" />
      <!-- Bottom Right -->
      <line x1="72" y1="57" x2="76" y2="50" />
      <line x1="72" y1="57" x2="67" y2="62" />
      <!-- Bottom -->
      <line x1="55" y1="62" x2="61" y2="56" />
      <line x1="55" y1="62" x2="49" y2="56" />
      <!-- Bottom Left -->
      <line x1="38" y1="55" x2="42" y2="61" />
      <line x1="38" y1="55" x2="34" y2="48" />
      <!-- Top Left -->
      <line x1="38" y1="39" x2="34" y2="45" />
      <line x1="38" y1="39" x2="43" y2="33" />
    </g>
    <!-- Center core crystal -->
    <circle cx="55" cy="46" r="3.5" fill="#38bdf8" />

    <!-- Swoosh Waves at bottom -->
    <path d="M 12 70 Q 35 105 75 92 Q 102 82 105 60 Q 92 88 58 82 Q 28 78 12 70 Z" fill="url(#waveGrad)" />
    <path d="M 22 79 Q 50 102 85 88 Q 105 80 109 68 Q 98 94 65 92 Q 38 90 22 79 Z" fill="url(#waveSubGrad)" opacity="0.85" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- ClimaMais -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#072146">Clima</tspan><tspan fill="#0056d6">Mais</tspan>
    </text>
    <!-- CLIMATIZAÇÃO -->
    <text x="4" y="82" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Montserrat', -apple-system, sans-serif" font-weight="800" font-size="19" fill="#0056d6" letter-spacing="8.5">
      CLIMATIZAÇÃO
    </text>
  </g>
</svg>